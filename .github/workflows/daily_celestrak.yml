# Downloads CelesTrak's current orbits once a day, matches them to the satellites in the
# Res 35 milestone PDFs, and saves the results back into this repository.
#
# When: every day at 12:30 UTC (7:30 Eastern in winter, 8:30 in summer), half an hour after
#   the weekly Res 35 update starts on Wednesdays, so on Wednesdays it uses the fresh SNL data.
#   Both workflows share the "repo-writes" queue, so they never save at the same time.
#
# CelesTrak usage policy: the script downloads each file once and stops on the first answer
# other than HTTP 200. A failed run shows a red X on the Actions tab and GitHub emails the
# repository owner; look at the run log before running it again.
#
# To run it by hand: GitHub > Actions tab > "Daily CelesTrak orbits" > Run workflow.

name: Daily CelesTrak orbits

on:
  schedule:
    - cron: "30 12 * * *"     # minute hour day-of-month month day-of-week
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code and data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Download CelesTrak orbits and match them to the Res 35 satellites
        run: python fetch_celestrak.py

      - name: Save results to the repository
        run: |
          git config user.name "res35-bot"
          git config user.email "res35-bot@users.noreply.github.com"
          git add data/celestrak output/res35_tracked_orbits.xlsx
          if git diff --cached --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Daily CelesTrak orbits $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
